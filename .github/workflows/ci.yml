# kerteriz CI — PHASE0.md · S4
#
# İşler: build · test (Humble + Jazzy matrisi) · core-standalone (ROS'suz)
#        lint (clang-format + clang-tidy) · checks (denetimler)
#
# Araç sürümleri Dockerfile (S3) ile kasten aynıdır; geliştirme imajı ile CI
# arasında biçimlendirici/linter çatlağı olmaması için:
#   clang-format 18.1.8 (pip, .pre-commit-config.yaml ile birebir)
#   clang-tidy   14      (Ubuntu 22.04 apt — bu yüzden lint işi 22.04'te koşar)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # ADR-12: birincil hedef Humble, CI matrisi Humble + Jazzy
  # ---------------------------------------------------------------------------
  build-test:
    name: build + test (${{ matrix.ros_distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [humble, jazzy]
    container:
      image: ros:${{ matrix.ros_distro }}-ros-base
    steps:
      - name: Bağımlılıklar
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git libeigen3-dev \
            python3-colcon-common-extensions
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4

      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          colcon build --event-handlers console_direct-

      - name: colcon test
        shell: bash
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          colcon test --event-handlers console_direct-
          colcon test-result --all --verbose

      # "0 test, 0 hata" YEŞİL görünür. Bu adım testlerin gerçekten keşfedilip
      # koşturulduğunu doğrular.
      #
      # Somut sebep: BUILD_TESTING global bir addır; bir bağımlılık veya üst
      # proje onu kapatırsa test hedefleri hiç kaydolmaz ve CI yine yeşil olur.
      # kerteriz_core bir dönem tam olarak bunu yapıyordu (bkz. CMakeLists
      # içindeki cache sızıntısı notu). kerteriz_eval'da da benzer bir
      # maskelenme yaşandı: Humble 0 testle sessizce geçiyordu.
      #
      # NOT: kerteriz_eval `colcon test-result`'a satır üretmiyor (unittest
      # yolu), bu yüzden burada sayılamıyor. Onun koruması ayrı: pytest/unittest
      # hiç test bulamazsa Jazzy exit 5 döndürür ve iş zaten kırmızı olur.
      - name: Testler gerçekten koştu mu
        shell: bash
        run: |
          python3 - <<'PY'
          import re, subprocess, sys
          from collections import defaultdict

          # Esik AMACLI olarak 1'dir: bu guard "paket hic test kosturmadi"
          # durumunu yakalar, test SAYISINI dondurmaz. Gercek sayiyi yazmak
          # her yeni testte CI'i kirar ve guard'i sayi guncelleme ritueline
          # cevirirdi. kerteriz_bringup F2.4'te GNSS seyreltme politikasinin,
          # withheld sozlesmesinin ve kosucu kapisinin tek dogrulama yeri
          # oldugu icin listeye alindi.
          beklenen = {"kerteriz_core": 1, "kerteriz_sim": 1, "kerteriz_ros": 1,
                      "kerteriz_bringup": 1}

          cikti = subprocess.run(["colcon", "test-result", "--all"],
                                 capture_output=True, text=True).stdout
          sayim = defaultdict(int)
          for satir in cikti.splitlines():
              m = re.match(r"build/([^/]+)/.*?:\s*(\d+) tests?,", satir)
              if m:
                  sayim[m.group(1)] += int(m.group(2))

          hata = False
          for paket, en_az in sorted(beklenen.items()):
              n = sayim.get(paket, 0)
              damga = "OK" if n >= en_az else "HATA"
              print(f"  {damga}  {paket}: {n} test (en az {en_az})")
              if n < en_az:
                  hata = True

          if hata:
              print("\nTestler koşmadı. BUILD_TESTING veya bir test hedefi "
                    "sessizce kapanmış olabilir.")
              sys.exit(1)
          print("\nTüm beklenen paketler test koşturdu.")
          PY

  # ---------------------------------------------------------------------------
  # R1 / ADR-1: kerteriz_core ROS kurulu OLMAYAN makinede derlenir.
  # ROS sürülmeyen bir runner'da düz CMake ile kurulur ve test edilir.
  # ---------------------------------------------------------------------------
  core-standalone:
    name: core-standalone (ROS'suz)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Bağımlılıklar
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git libeigen3-dev

      - name: ROS ortamı gerçekten yok mu
        run: |
          test -z "${AMENT_PREFIX_PATH:-}" || { echo "AMENT_PREFIX_PATH dolu"; exit 1; }
          test -z "${ROS_DISTRO:-}"        || { echo "ROS_DISTRO dolu"; exit 1; }
          test ! -d /opt/ros               || { echo "/opt/ros mevcut"; exit 1; }
          echo "ROS ortamı yok — bağımsız derleme anlamlı."

      - name: Configure · build · test
        run: |
          cmake -S kerteriz_core -B build/core -DCMAKE_BUILD_TYPE=Release
          cmake --build build/core -j"$(nproc)"
          ctest --test-dir build/core --output-on-failure

      - name: Test binary'si ROS'a linklenmemiş
        run: |
          if ldd build/core/test/test_dependencies | grep -iE "ros|rcl|rmw"; then
            echo "ROS linki bulundu"; exit 1
          fi
          echo "ROS linki yok."

  # ---------------------------------------------------------------------------
  # lint — sürümler Dockerfile ile aynı (bkz. dosya başı notu)
  # ---------------------------------------------------------------------------
  lint:
    name: lint (clang-format + clang-tidy)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Bağımlılıklar
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git libeigen3-dev clang-tidy libgtest-dev
          pip3 install --no-cache-dir "clang-format==18.1.8"

      - name: Sürümler
        run: |
          clang-format --version
          clang-tidy --version | head -1

      - name: clang-format
        run: |
          files=$(git ls-files '*.hpp' '*.cpp')
          [ -n "$files" ] || { echo "C++ kaynağı yok — atlanıyor."; exit 0; }
          clang-format --dry-run --Werror $files

      - name: clang-tidy (kerteriz_core)
        run: |
          files=$(git ls-files 'kerteriz_core/*.cpp')
          [ -n "$files" ] || { echo "kerteriz_core'da .cpp yok — atlanıyor."; exit 0; }
          cmake -S kerteriz_core -B build/tidy -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          clang-tidy -p build/tidy $files

      # kerteriz_sim başlık-içi (INTERFACE) bir kütüphanedir: production
      # başlıkları hiçbir zaman tek başına derlenmez, yalnızca onları dahil
      # eden bir translation unit üzerinden analiz edilebilir. O yüzden tidy
      # test TU'ları üzerinden koşar; .clang-tidy'nin HeaderFilterRegex'i
      # zaten kerteriz_sim/include'u kapsadığı için teşhisler production
      # başlıklarından da gelir.
      #
      # Ayrı build dizini (build/tidy-sim) gerekir: core'un tidy configure'u
      # kerteriz_sim hedeflerini içermez.
      - name: clang-tidy (kerteriz_sim)
        run: |
          files=$(git ls-files 'kerteriz_sim/test/*.cpp')
          # Burada "dosya yok -> atla" YOK. Bu TU'lar sim başlıklarının tek
          # analiz yoludur; kaybolurlarsa sessizce geçmek yerine düşmeliyiz.
          [ -n "$files" ] || { echo "kerteriz_sim test TU'su bulunamadı."; exit 1; }
          cmake -S kerteriz_sim -B build/tidy-sim -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

          # compile_commands.json'da olmayan bir dosyaya clang-tidy tahmini
          # bayraklarla bakar ve eksik analiz edip yine 0 döndürebilir.
          python3 - $files <<'PY'
          import json, os, sys
          db = {os.path.realpath(e["file"])
                for e in json.load(open("build/tidy-sim/compile_commands.json"))}
          eksik = [f for f in sys.argv[1:] if os.path.realpath(f) not in db]
          if eksik:
              print("compile_commands.json'da yok:", eksik)
              sys.exit(1)
          print(f"{len(sys.argv) - 1} TU derleme veritabanında mevcut.")
          PY

          clang-tidy -p build/tidy-sim $files

  # ---------------------------------------------------------------------------
  # checks — CLAUDE.md §6.1 denetimleri
  #
  # ① ve ⑤ burada zorlanır.
  #
  # ② (durum kapasitesi) S5'te geldi ve DERLEME ZAMANINDA zorlanır:
  # types.hpp içindeki static_assert'ler. Ayrı bir adım gerekmez — kapasite
  # bozulursa build-test ve core-standalone işleri derlenmez. Denetimin
  # kayıt sırasındaki yarısı NavState ile (Faz 1) gelecek.
  #
  # ③ (J_res işareti) S8'de geldi: test_linear_update içindeki
  # ClosedFormScalarGaussian. Ayrı bir adım gerekmez — testi build-test ve
  # core-standalone işleri zaten koşturur ve düşerse iş kırmızı olur.
  # Ampirik olarak doğrulandı: güncellemede işaret çevrildiğinde bu test
  # düşer, sayısal Jacobian testi ise geçmeye devam eder.
  #
  # ④ (Jacobian testi zorunluluğu) S10'da geldi: test_measurement_registry
  # içindeki Denetim4.* testleri. Ayrı bir adım gerekmez — registry programın
  # kendi içindedir, denetim de bir testtir. CLAUDE.md §6.1 dosya tarayan
  # script yazmayı zaten yasaklar. Testi build-test ve core-standalone işleri
  # koşturur; bir ölçüm Jacobian testsiz kaydolursa paket düşer.
  # Ampirik olarak doğrulandı: SahteTeker'in test kaydı silindiğinde denetim
  # tipi adıyla düşüyor, gövdesiz bir test kaydı ise hiç linklenmiyor.
  #
  # ⑤ (doküman ve kod tutarlılığı) S11'de tam kapıya çevrildi:
  # tools/check_docs.py. Doküman yarısı eskiden yalnızca raporluyordu.
  #
  # Böylece beş denetimin beşi de canlı. Sahte "geçti" üretmemek için bugün
  # var olmayan denetimler burada taklit EDİLMEZ.
  # ---------------------------------------------------------------------------
  checks:
    name: checks (denetimler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Denetim ① — kerteriz_core ROS'suz
        run: |
          if grep -rE "rclcpp|_msgs/|ament_" kerteriz_core/ \
               --include=*.hpp --include=*.cpp --include=CMakeLists.txt; then
            echo "R1 ihlali: kerteriz_core içinde ROS sembolü."; exit 1
          fi
          echo "Denetim ① temiz."

      # Denetim ⑤ tek script'tir (S11). Kod tarafinda muafiyet YOKTUR; dokuman
      # tarafinda muafiyet acik isaretlemeyle verilir ve script bunu allowlist
      # gibi zorlar (bos muafiyet ve sebepte adi gecmeyen sembol = hata).
      #
      # Eskiden dokuman yarisi yalnizca RAPORLUYORDU, cunku muafiyet
      # mekanizmasi makine-okunur degildi. Artik oyle; sert kapiya cevrildi.
      # Kapının kendisi bozulursa hiçbir şey uyarmaz, her şey yeşil kalır.
      # Bu yüzden gerçek taramadan ÖNCE tarayıcının kendi regresyon testi koşar.
      - name: Denetim ⑤ — doküman ve kod tutarlılığı
        run: |
          python3 tools/check_docs.py --self-test
          python3 tools/check_docs.py

      # Numara surekliligi TEK BASINA yetmez: dizin girisi ile bolunmus dosya
      # ayni numarayi verir, biri kaybolsa oteki numarayi ayakta tutar ve
      # denetim yesil kalir. Link butunlugu ve ad/baslik eslesmesi bu yuzden
      # ayri kontrollerdir.
      - name: ADR bütünlüğü
        run: python3 tools/check_adr.py
